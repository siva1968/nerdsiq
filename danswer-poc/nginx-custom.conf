server {
    listen 80;
    server_name localhost;

    # Block signup page - invite-only access
    location ~ ^/auth/signup {
        return 404;
    }

    # Block signup API endpoint
    location ~ ^/api/auth/register {
        return 404;
    }

    # Customize and secure login page
    location = /auth/login {
        proxy_pass http://web_server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Disable browser caching to ensure customizations are visible
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Inject customizations: hide signup link, rebrand login page
        sub_filter_types text/html;
        sub_filter '</head>' '<style>a[href*="/auth/signup"],a[href^="/signup"]{display:none!important}</style><script>(function(){function rebrand(){var t=document.querySelector("h1");if(t&&t.textContent.includes("Onyx")){t.textContent="Welcome to NerdsIQ"}var e=document.querySelector("p");if(e&&e.textContent.includes("open source")){e.textContent="Your AI-powered knowledge assistant"}}function startObserver(){if(document.body){new MutationObserver(rebrand).observe(document.body,{childList:true,subtree:true})}else{setTimeout(startObserver,50)}}rebrand();setTimeout(rebrand,100);setTimeout(rebrand,500);setTimeout(rebrand,1000);startObserver()})();</script></head>';
        sub_filter_once on;
    }

    location / {
        proxy_pass http://web_server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    location /api/ {
        proxy_pass http://api_server:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
