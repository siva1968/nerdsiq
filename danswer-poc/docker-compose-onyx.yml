# Onyx (formerly Danswer) - Simplified POC Configuration
# Ports adjusted to avoid conflicts with existing NerdsIQ setup

name: onyx-poc

services:
  api_server:
    image: onyxdotapp/onyx-backend:latest
    container_name: onyx-api
    command: >
      /bin/sh -c "alembic upgrade head &&
      echo \"Starting Onyx Api Server\" &&
      uvicorn onyx.main:app --host 0.0.0.0 --port 8080"
    env_file:
      - .env
    depends_on:
      - relational_db
      - index
      - cache
      - inference_model_server
      - minio
    restart: unless-stopped
    ports:
      - "8180:8080"
    environment:
      - AUTH_TYPE=${AUTH_TYPE:-disabled}
      - POSTGRES_HOST=relational_db
      - VESPA_HOST=index
      - REDIS_HOST=cache
      - MODEL_SERVER_HOST=inference_model_server
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_AWS_ACCESS_KEY_ID=minioadmin
      - S3_AWS_SECRET_ACCESS_KEY=minioadmin
      - WEB_DOMAIN=https://onyx.getinstantleads.in
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api_server_logs:/var/log/onyx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 25s

  background:
    image: onyxdotapp/onyx-backend:latest
    container_name: onyx-background
    command: /app/scripts/supervisord_entrypoint.sh
    env_file:
      - .env
    depends_on:
      - relational_db
      - index
      - cache
      - inference_model_server
      - indexing_model_server
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=relational_db
      - VESPA_HOST=index
      - REDIS_HOST=cache
      - MODEL_SERVER_HOST=inference_model_server
      - INDEXING_MODEL_SERVER_HOST=indexing_model_server
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_AWS_ACCESS_KEY_ID=minioadmin
      - S3_AWS_SECRET_ACCESS_KEY=minioadmin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - background_logs:/var/log/onyx

  web_server:
    image: onyxdotapp/onyx-web-server:latest
    container_name: onyx-web
    env_file:
      - .env
    depends_on:
      - api_server
    restart: unless-stopped
    environment:
      - INTERNAL_URL=http://api_server:8080
      - WEB_DOMAIN=https://onyx.getinstantleads.in
      - NEXT_PUBLIC_URL=https://onyx.getinstantleads.in
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  inference_model_server:
    image: onyxdotapp/onyx-model-server:latest
    container_name: onyx-inference
    command: >
      /bin/sh -c "exec uvicorn model_server.main:app --host 0.0.0.0 --port 9000"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - model_cache_huggingface:/app/.cache/huggingface/
      - inference_model_server_logs:/var/log/onyx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

  indexing_model_server:
    image: onyxdotapp/onyx-model-server:latest
    container_name: onyx-indexing
    command: >
      /bin/sh -c "exec uvicorn model_server.main:app --host 0.0.0.0 --port 9000"
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - INDEXING_ONLY=True
    volumes:
      - indexing_huggingface_model_cache:/app/.cache/huggingface/
      - indexing_model_server_logs:/var/log/onyx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

  relational_db:
    image: postgres:15.2-alpine
    container_name: onyx-postgres
    command: -c 'max_connections=250'
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_volume:/var/lib/postgresql/data

  index:
    image: vespaengine/vespa:8.609.39
    container_name: onyx-index
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VESPA_SKIP_UPGRADE_CHECK=true
    ports:
      - "19171:19071"
      - "8181:8081"
    volumes:
      - vespa_volume:/opt/vespa/var

  nginx:
    image: nginx:1.25.5-alpine
    container_name: onyx-nginx
    restart: unless-stopped
    depends_on:
      - api_server
      - web_server
    env_file:
      - .env
    environment:
      - DOMAIN=localhost
    ports:
      - "3100:80"
    volumes:
      - ./nginx-custom.conf:/etc/nginx/conf.d/default.conf
    command: nginx -g 'daemon off;'

  cache:
    image: redis:7.4-alpine
    container_name: onyx-redis
    restart: unless-stopped
    ports:
      - "6479:6379"
    command: redis-server --save "" --appendonly no
    env_file:
      - .env
    tmpfs:
      - /data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    container_name: onyx-minio
    restart: unless-stopped
    ports:
      - "9104:9000"
      - "9105:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: onyx-file-store-bucket
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: onyx-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx

volumes:
  db_volume:
  vespa_volume:
  minio_data:
  model_cache_huggingface:
  indexing_huggingface_model_cache:
  api_server_logs:
  background_logs:
  inference_model_server_logs:
  indexing_model_server_logs:
