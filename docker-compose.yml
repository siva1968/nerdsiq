# NerdsIQ Docker Compose
# Run: docker-compose up -d

services:
  # PostgreSQL Database (same for dev and production)
  postgres:
    image: postgres:16.2-alpine  # Pinned version for consistency
    container_name: nerdsiq-postgres
    environment:
      POSTGRES_USER: nerdsiq
      POSTGRES_PASSWORD: nerdsiq_dev_password
      POSTGRES_DB: nerdsiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerdsiq -d nerdsiq"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4  # Pinned version for consistency
    container_name: nerdsiq-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nerdsiq-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - wordpress
    restart: unless-stopped

  # NerdsIQ Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nerdsiq-api
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATABASE_URL=postgresql+asyncpg://nerdsiq:nerdsiq_dev_password@postgres:5432/nerdsiq
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/credentials:/app/credentials

  # MySQL Database for WordPress (local dev only)
  mysql:
    image: mysql:8.0
    container_name: nerdsiq-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # WordPress (local dev only - production uses WPEngine)
  wordpress:
    image: wordpress:latest
    container_name: nerdsiq-wordpress
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress-plugin/nerdsiq-chatbot:/var/www/html/wp-content/plugins/nerdsiq-chatbot
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Cloudflare Tunnel (exposes local services to internet)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nerdsiq-cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run nerdsiq-dev
    volumes:
      - ./cloudflared-config-docker.yml:/etc/cloudflared/config.yml:ro
      - ${USERPROFILE}/.cloudflared:/etc/cloudflared/credentials:ro
    depends_on:
      - api
      - wordpress
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  mysql_data:
    driver: local
  wordpress_data:
    driver: local
